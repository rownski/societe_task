services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: societe_task
      POSTGRES_USER: societe
      POSTGRES_PASSWORD: societe
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U societe -d societe_task"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
